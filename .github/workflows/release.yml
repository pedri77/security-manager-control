# release.yml — PLAYBOOK-F2P-001 · S7 (Release)
# Gate humano = aprobar y hacer merge del PR de release que abre release-please.
# Al crearse la release: SBOM CycloneDX + firma cosign keyless + evidence pack, adjuntos a la release.
#
# Requiere el secreto RELEASE_PLEASE_TOKEN (fine-grained, solo este repo: contents y pull requests
# de escritura). Con GITHUB_TOKEN el PR de release no dispara workflows, los checks obligatorios no
# llegan nunca y el PR queda bloqueado.
name: release

on:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  SYFT_IMAGE: anchore/syft:v1.56.0@sha256:697ae864af1299cfa43c54b161cea3dd65c6d54de82e3dba66ea3dccb3acc313

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  evidence:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
      checks: read
      statuses: read
      id-token: write   # firma keyless de cosign (OIDC)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # La firma keyless escribe la identidad del repo y del workflow en Rekor, un log público.
      # En un repo privado eso revela su nombre: parar hasta decidir firma con clave propia.
      - name: Repo privado sin firma keyless
        if: github.event.repository.private
        run: |
          echo "::error::Repo privado: la firma keyless publicaría su identidad en Rekor. Ver PLAYBOOK-F2P-001 §3."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, fetch-tags: true, persist-credentials: false }
      - name: SBOM
        run: |
          mkdir -p "evidence/$TAG"
          docker run --rm -v "$PWD:/src" "$SYFT_IMAGE" dir:/src -o "cyclonedx-json=/src/evidence/$TAG/sbom.cdx.json"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Firmar SBOM (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle "evidence/$TAG/sbom.cdx.json.bundle" \
            "evidence/$TAG/sbom.cdx.json"
      - name: Evidence pack (change record de la release)
        run: python3 scripts/change_evidence.py release --tag "$TAG" --out "evidence/$TAG"
      - name: Adjuntar a la release
        run: gh release upload "$TAG" evidence/"$TAG"/* --clobber
