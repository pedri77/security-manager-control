# Evaluación de cliente — copiar a assessments/<cliente>/assessment.yaml
cliente:
  nombre: "<cliente>"
  sector: ""                     # Anexo I/II NIS2: energía, transporte, banca, sanidad, agua, infra digital, AAPP...
  tamano: "micro | pequena | mediana | grande"
  tipo_entidad_nis2: "esencial | importante | no_obligada"
  sector_publico: false          # true => se evalúa ENS
  proveedor_sector_publico: false  # true => también ENS
  categoria_ens: "BASICA | MEDIA | ALTA"
  fecha: "YYYY-MM-DD"
  evaluador: ""

# Estado por control: implementado | parcial | no_implementado | no_aplica
# Controles no listados se consideran "sin evaluar".
evaluaciones:
  NIS2-21.2.a:
    estado: parcial
    evidencias: []
    notas: ""

# Plan de acción (RF-08). Responsable = ROL, no nombre de persona.
# estado: pendiente | en_curso | hecha | bloqueada ; fecha_objetivo: YYYY-MM-DD
plan_accion:
  - id: ACC-01
    controles: [NIS2-21.2.a]
    accion: ""
    responsable: "RSI"
    fecha_objetivo: "YYYY-MM-DD"
    estado: pendiente
