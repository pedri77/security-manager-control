  VRT-FW: {madurez: 4, producto: "Firewall ejemplo"}
  VRT-ZTNA: {madurez: 1, notas: "Piloto con un grupo de usuarios"}
  VRT-GRC: {madurez: 4, notas: "Indicadores trimestrales al comité; auditoría anual con plan de acción"}
  VRT-IDSEC: {madurez: 4, notas: "PAM con grabación de sesiones; recertificación medida"}
  VRT-DSPM: {madurez: 3, notas: "DLP en correo y endpoint; DSPM sin desplegar"}
