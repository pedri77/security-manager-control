  - id: AIA-014
    articulo: "art. 13"
    titulo: Transparencia e instrucciones de uso
    descripcion: Diseñar el sistema con transparencia suficiente y acompañarlo de instrucciones de uso para el responsable del despliegue.
    roles: [proveedor]
    niveles: [alto_riesgo_anexo_iii, alto_riesgo_anexo_i]
    aplica_desde: {alto_riesgo_anexo_iii: 2027-12-02, alto_riesgo_anexo_i: 2028-08-02}
    fuente: OMNIBUS
  - id: AIA-015
    articulo: "art. 14"
    titulo: Supervisión humana (diseño)
    descripcion: Diseñar el sistema para que personas físicas puedan vigilarlo de manera efectiva mientras está en uso, con interfaz humano-máquina adecuada.
