    niveles: [alto_riesgo_anexo_iii, alto_riesgo_anexo_i]
    aplica_desde: {alto_riesgo_anexo_iii: 2027-12-02, alto_riesgo_anexo_i: 2028-08-02}
    evidencia: documentacion_tecnica
    fuente: OMNIBUS
  - id: AIA-013
    articulo: "art. 12"
    titulo: Registro automático de acontecimientos
    descripcion: El sistema debe permitir técnicamente el registro automático de acontecimientos (archivos de registro) durante todo su ciclo de vida.
