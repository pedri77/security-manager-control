# RIA: Reglamento (UE) 2024/1689 de Inteligencia Artificial, modificado por el Reglamento (UE) 2026/1744 (Ómnibus digital sobre IA).
# Resumen operativo por rol y nivel de riesgo. NO es asesoramiento jurídico: el texto que obliga es el del DOUE.
#
# Fuentes (fecha de consulta: 2026-11-03; ver docs/plan/informes/T26-dev-proyecto.md):
#   RIA      https://eur-lex.europa.eu/eli/reg/2024/1689/oj
#            EUR-Lex respondió 202 sin cuerpo a clientes automáticos; se leyó la copia del DOUE en el BOE:
#            https://www.boe.es/buscar/doc.php?id=DOUE-L-2024-81079 (art. 4, 5, 6, 9-17, 23, 24, 26, 27, 49, 50, 53-55, 111, 113)
#   OMNIBUS  https://eur-lex.europa.eu/eli/reg/2026/1744/oj  (DO L de 24.7.2026; en vigor a los tres días: 2026-07-27, art. 4)
#            Copia del DOUE en el BOE: https://www.boe.es/doue/2026/1744/L00001-00041.pdf
#            Punto 40 (art. 113 RIA): alto riesgo Anexo III 2027-12-02; Anexo I 2028-08-02; art. 5.1 b bis) y b ter) 2026-12-02.
#            Punto 39 b) (nuevo art. 111.4 RIA): art. 50.2 para sistemas en el mercado antes de 2026-08-02, a más tardar 2026-12-02.
#            Punto 39 a) (nuevo art. 111.2 RIA): alto riesgo en el mercado antes de la fecha del capítulo III, obligados solo con
#            cambios significativos de diseño; los destinados a autoridades públicas, a más tardar 2030-08-02 (cita en T29).
#            Punto 5: nuevo art. 4 (alfabetización: «apoyar la promoción», sin exigir un nivel concreto).
#            El art. 50 (salvo su apartado 7) no cambia de fecha: aplica desde la fecha general, 2026-08-02 (art. 113 RIA).
#
# Esquema de cada obligación:
#   id, articulo, titulo, descripcion   texto breve (paráfrasis, no cita)
#   roles      proveedor | responsable_despliegue | importador | distribuidor
#   niveles    prohibido | alto_riesgo_anexo_iii | alto_riesgo_anexo_i | transparencia | uso_general
#              | uso_general_riesgo_sistemico | minimo
#   aplica_desde   fecha AAAA-MM-DD, o mapa nivel -> fecha si depende del nivel
#   supuesto   (opcional) solo aplica si el sistema lo declara en `supuestos`
#   excepto_supuesto (opcional) no aplica si el sistema lo declara
#   transitorio (opcional) {en_mercado_antes_de, aplica_desde}: fecha distinta para sistemas o modelos ya en el mercado
#   preexistente (opcional) true = solo aplica a sistemas con `en_mercado_desde` anterior a la fecha de su nivel (art. 111.2)
#   evidencia  (opcional) campo del inventario que acredita el cumplimiento (supervision_humana, registro, ...)
#   fuente     RIA | OMNIBUS (la que fija la fecha vigente)
#   verificar  true = fecha o alcance no cerrados con el texto; `nota` explica por qué
version: "RIA 2024/1689 + Ómnibus 2026/1744"
consulta: 2026-11-03
fuentes:
  - {id: RIA, titulo: "Reglamento (UE) 2024/1689 (RIA)", url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", copia: "https://www.boe.es/buscar/doc.php?id=DOUE-L-2024-81079", consulta: 2026-11-03}
  - {id: OMNIBUS, titulo: "Reglamento (UE) 2026/1744 (Ómnibus digital sobre IA)", url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj", copia: "https://www.boe.es/doue/2026/1744/L00001-00041.pdf", consulta: 2026-11-03}
roles: [proveedor, responsable_despliegue, importador, distribuidor]
niveles: [prohibido, alto_riesgo_anexo_iii, alto_riesgo_anexo_i, transparencia, uso_general, uso_general_riesgo_sistemico, minimo]
supuestos:
  interaccion: "El sistema interactúa directamente con personas físicas (art. 50.1)"
  contenido_sintetico: "Genera contenido sintético de audio, imagen, vídeo o texto (art. 50.2)"
  emociones_biometria: "Reconocimiento de emociones o categorización biométrica (art. 50.3)"
  ultrasuplantacion: "Genera o manipula ultrasuplantaciones (deepfakes) (art. 50.4)"
  contenido_intimo_no_consentido: "Práctica del art. 5.1 b bis) o b ter) (añadidas por el Ómnibus)"
  ambito_art27: "Responsable del despliegue de Derecho público o que presta servicios públicos, o Anexo III punto 5 b) o c)"
  organismo_publico: "Responsable del despliegue que es autoridad, órgano u organismo público (art. 49.3)"
  lugar_de_trabajo: "Uso en el lugar de trabajo por un empleador (art. 26.7)"
  proveedor_tercer_pais: "Proveedor establecido fuera de la Unión (art. 54)"

obligaciones:
  # --- Todas las categorías ---
  - id: AIA-001
    articulo: "art. 4"
    titulo: Alfabetización en materia de IA
    descripcion: Adoptar medidas para apoyar la alfabetización en IA del personal que opera o usa el sistema, según su perfil y el contexto de uso. Tras el Ómnibus no exige garantizar un nivel concreto.
    roles: [proveedor, responsable_despliegue]
    niveles: [alto_riesgo_anexo_iii, alto_riesgo_anexo_i, transparencia, minimo]
    aplica_desde: 2025-02-02
    evidencia: alfabetizacion
    fuente: RIA
    nota: "Capítulo I aplicable desde 2025-02-02 (art. 113 a). Texto sustituido por el Ómnibus (punto 5), en vigor 2026-07-27."

  # --- Prácticas prohibidas (art. 5) ---
  - id: AIA-002
    articulo: "art. 5"
    titulo: Práctica de IA prohibida
    descripcion: No introducir en el mercado, poner en servicio ni utilizar el sistema; retirarlo o dejar de usarlo.
    roles: [proveedor, responsable_despliegue, importador, distribuidor]
    niveles: [prohibido]
    aplica_desde: 2025-02-02
    excepto_supuesto: contenido_intimo_no_consentido
    evidencia: retirado
    fuente: RIA
  - id: AIA-003
    articulo: "art. 5.1 b bis) y b ter)"
    titulo: Prohibición de contenido íntimo no consentido y de material de abuso sexual infantil
    descripcion: No introducir, poner en servicio ni usar sistemas que generen o manipulen imágenes íntimas realistas de personas identificables sin su consentimiento, ni material del art. 2 c) y e) de la Directiva 2011/93/UE.
    roles: [proveedor, responsable_despliegue, importador, distribuidor]
    niveles: [prohibido]
    aplica_desde: 2026-12-02
    supuesto: contenido_intimo_no_consentido
    evidencia: retirado
    fuente: OMNIBUS
    nota: "Letras añadidas por el Ómnibus (punto 7); fecha en el art. 113 a) modificado (punto 40 a)."

  # --- Alto riesgo: proveedor (capítulo III, secciones 2 y 3) ---
  - id: AIA-010
    articulo: "art. 9"
    titulo: Sistema de gestión de riesgos
    descripcion: Establecer, documentar y mantener un sistema de gestión de riesgos durante todo el ciclo de vida.
    roles: [proveedor]
