  - id: AIA-019
    articulo: "art. 49.1"
    titulo: Registro en la base de datos de la UE (proveedor)
    descripcion: Registrar el sistema y al proveedor en la base de datos de la UE antes de introducirlo en el mercado (Anexo III, salvo punto 2).
