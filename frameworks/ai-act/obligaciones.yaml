    fuente: RIA

  # --- Sistemas de alto riesgo ya en el mercado (art. 111.2, Ómnibus punto 39 a) ---
  - id: AIA-070
    articulo: "art. 111.2"
    titulo: Alto riesgo ya en el mercado antes del capítulo III
    descripcion: El RIA solo se aplica a un sistema de alto riesgo introducido en el mercado o puesto en servicio antes de la fecha del capítulo III si, a partir de esa fecha, sufre cambios significativos de diseño. Si está destinado a autoridades públicas, proveedor y responsable del despliegue adoptan las medidas necesarias a más tardar el 2030-08-02.
    roles: [proveedor, responsable_despliegue]
    niveles: [alto_riesgo_anexo_iii, alto_riesgo_anexo_i]
    aplica_desde: {alto_riesgo_anexo_iii: 2027-12-02, alto_riesgo_anexo_i: 2028-08-02}
    preexistente: true
    fuente: OMNIBUS
    nota: "Solo se emite para sistemas con en_mercado_desde anterior a la fecha de su nivel; sigue saliendo como aviso aunque no haya cambios. Campos del inventario: cambios_significativos y autoridad_publica (opcionales, solo true o false). Si se declara cambios_significativos: false, las obligaciones del capítulo III (campo articulo entre arts. 6 y 49) de ese sistema no se emiten como pendientes: salen en regimen_transitorio con la fecha en que pasarían a aplicar (2030-08-02 con autoridad_publica; si no, solo con cambios significativos). Si el dato falta, no consta: se emiten como pendientes y se avisa. No se recortan las del art. 4, 5, 50 ni uso general, ni las de fuera del capítulo III (p. ej. arts. 72 y 73). Texto del apartado 2 leído en la copia del DOUE del RIA (BOE) y en el Ómnibus (punto 39 a); EUR-Lex no sirvió el texto a clientes automáticos. El texto habla de «el presente Reglamento», no solo del capítulo III: limitar el recorte al capítulo III es el criterio de SMC. No se modela el apartado 1 (sistemas informáticos de gran magnitud del anexo X). Cambio significativo no está definido en el catálogo: lo decide quien declara."
