  - id: AIA-011
    articulo: "art. 10"
    titulo: Datos y gobernanza de datos
    descripcion: Conjuntos de datos de entrenamiento, validación y prueba con prácticas de gobernanza adecuadas a la finalidad prevista.
    roles: [proveedor]
    niveles: [alto_riesgo_anexo_iii, alto_riesgo_anexo_i]
    aplica_desde: {alto_riesgo_anexo_iii: 2027-12-02, alto_riesgo_anexo_i: 2028-08-02}
    fuente: OMNIBUS
  - id: AIA-012
    articulo: "art. 11"
    titulo: Documentación técnica
    descripcion: Elaborar la documentación técnica (Anexo IV) antes de introducir el sistema en el mercado y mantenerla actualizada.
