    fuente: OMNIBUS
  - id: AIA-016
    articulo: "art. 15"
    titulo: Precisión, solidez y ciberseguridad
    descripcion: Nivel adecuado de precisión, solidez y ciberseguridad, incluida la resistencia a la manipulación de datos o de entradas.
    roles: [proveedor]
    niveles: [alto_riesgo_anexo_iii, alto_riesgo_anexo_i]
    aplica_desde: {alto_riesgo_anexo_iii: 2027-12-02, alto_riesgo_anexo_i: 2028-08-02}
