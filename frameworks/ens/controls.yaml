# ENS — Real Decreto 311/2022, Anexo II (73 medidas)
# Fuente: BOE-A-2022-7191, texto consolidado, Anexo II, tabla de medidas (apartado 2.4).
#   https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191  ·  https://www.boe.es/eli/es/rd/2022/05/03/311/con
# Fecha de consulta: 2026-11-03 (contraste T21; ver docs/plan/informes/T21-dev-proyecto.md).
# Aplica a: sector público (art. 2) y proveedores que le presten servicios o soluciones.
# Categorías del sistema: BASICA | MEDIA | ALTA.
# `categoria_minima`: categoría más baja con «aplica» o «+ Rn» en la tabla (columnas BÁSICA/MEDIA/ALTA; «n.a.» = no aplica).
# `refuerzos_por_categoria`: lo que dice la celda de esa categoría, tal cual (no acumulado: ALTA «+ R2» se guarda [R2]).
#   Una alternativa se guarda como cadena «[R1 o R2 o R3]» (se elige uno de los refuerzos).
# `dimensiones`: la medida depende de las dimensiones C/I/T/A/D (columna «Por categoría o dimensión(es)»), no solo de la categoría.
#   En ellas `categoria_minima` es una aproximación (nivel BAJO/MEDIO/ALTO ≈ categoría) y se mantiene `verificar: true` con `nota`.
# `verificar: true` = pendiente de contrastar (dependencia de dimensiones o de guías CCN-STIC no consultadas).
framework: ENS
version: "RD 311/2022"
