# ENS — Real Decreto 311/2022, Anexo II (73 medidas)
# Aplica a: sector público (art. 2) y proveedores que le presten servicios o soluciones.
# Categorías del sistema: BASICA | MEDIA | ALTA.
# `categoria_minima`: categoría más baja en la que la medida aplica. `refuerzos_por_categoria`: refuerzos R1..Rn exigibles.
# `verificar: true` = rellenado de memoria sin acceso a la fuente; contrastar con Anexo II y CCN-STIC 804/808 (ver informe T01).
# TODO: contrastar las medidas con `verificar: true` antes de dar el scoring por categoría como definitivo.
framework: ENS
