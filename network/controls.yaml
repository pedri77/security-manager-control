  - {id: NET-WIFI-01, dominio: Wi-Fi, titulo: "WPA3/802.1X corporativo e invitados aislados", relacion: [ENS-mp.com.2]}
  - {id: NET-DNS-01, dominio: DNS, titulo: "DNS protector/filtrado y registro de consultas", relacion: [ENS-mp.s.3]}
