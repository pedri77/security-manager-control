  - {id: NET-SEG-02, dominio: Segmentación, titulo: "Red de gestión out-of-band separada", relacion: [ENS-mp.com.4]}
  - {id: NET-SEG-03, dominio: Segmentación, titulo: "Microsegmentación / filtrado este-oeste en servidores críticos", relacion: [ENS-mp.com.4]}
  - {id: NET-PER-01, dominio: Perímetro, titulo: "Firewall perimetral con política deny-by-default y revisión periódica de reglas", relacion: [ENS-mp.com.1]}
  - {id: NET-PER-02, dominio: Perímetro, titulo: "Superficie expuesta a Internet inventariada (EASM) y justificada", relacion: [ENS-mp.com.1, NIS2-21.2.e]}
  - {id: NET-PER-03, dominio: Perímetro, titulo: "WAF y protección anti-DDoS en servicios publicados", relacion: [ENS-mp.s.2, ENS-mp.s.4]}
  - {id: NET-ACC-01, dominio: Acceso remoto, titulo: "VPN/ZTNA con MFA; sin RDP/SSH expuestos", relacion: [NIS2-21.2.j, ENS-op.acc.6]}
  - {id: NET-ACC-02, dominio: Acceso remoto, titulo: "Acceso de terceros controlado, temporal y registrado", relacion: [ENS-op.ext.4]}
