  - {seccion: "5",  tema: Seguridad de la cadena de suministro, controles: [NIS2-21.2.d]}
  - {seccion: "6",  tema: "Seguridad en la adquisición, desarrollo y mantenimiento", controles: [NIS2-21.2.e]}
  - {seccion: "7",  tema: Evaluación de la eficacia de las medidas, controles: [NIS2-21.2.f]}
  - {seccion: "8",  tema: Ciberhigiene básica y formación, controles: [NIS2-21.2.g]}
