# NIS2 — Marco normativo europeo completo
# Se incluye íntegro como referencia con independencia de la transposición española.
# Resúmenes propios; el texto legal vinculante es el publicado en el DOUE (ver `fuentes`).
version: v1
fecha_revision: "2026-11-02"

