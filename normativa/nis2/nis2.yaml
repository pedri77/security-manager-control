  - id: ES-ANTEPROYECTO
    titulo: Anteproyecto de Ley de Coordinación y Gobernanza de la Ciberseguridad (España)
    tipo: transposicion_nacional
    estado: "En tramitación (aprobado en Consejo de Ministros el 2025-01-14; sin publicar en BOE a nov. 2026)"
    novedades: [Crea el Centro Nacional de Ciberseguridad, Figura del responsable de seguridad de la información]
    url: https://www.interior.gob.es/

# Artículos clave de la Directiva
articulos:
  - {art: "2",  tema: Ámbito de aplicación, resumen: "Medianas y grandes empresas de los sectores de los Anexos I y II; algunas entidades con independencia del tamaño (DNS, TLD, telecos, trust services, AAPP central)."}
  - {art: "3",  tema: Entidades esenciales e importantes, resumen: "Esenciales: grandes empresas del Anexo I y casos especiales. Importantes: el resto dentro del ámbito. Cambia el régimen de supervisión y sanciones."}
  - {art: "7",  tema: Estrategia nacional de ciberseguridad, resumen: "Cada Estado adopta una estrategia nacional."}
  - {art: "10", tema: CSIRT, resumen: "Designación de CSIRT nacionales (en España CCN-CERT, INCIBE-CERT, ESPDEF-CERT)."}
  - {art: "20", tema: Gobernanza, resumen: "La dirección aprueba y supervisa las medidas, responde de su incumplimiento y debe formarse.", controles: [NIS2-20.1, NIS2-20.2]}
  - {art: "21", tema: Medidas de gestión de riesgos, resumen: "Enfoque todos los riesgos; diez medidas mínimas (letras a–j).", controles: [NIS2-21.2.a, NIS2-21.2.b, NIS2-21.2.c, NIS2-21.2.d, NIS2-21.2.e, NIS2-21.2.f, NIS2-21.2.g, NIS2-21.2.h, NIS2-21.2.i, NIS2-21.2.j]}
  - {art: "23", tema: Obligaciones de notificación, resumen: "Incidente significativo: alerta temprana 24 h, notificación 72 h, informe intermedio a petición, informe final en un mes.", controles: [NIS2-23.alerta, NIS2-23.notificacion, NIS2-23.final]}
  - {art: "24", tema: Esquemas de certificación, resumen: "Los Estados pueden exigir productos/servicios/procesos TIC certificados."}
  - {art: "27", tema: Registro de entidades, resumen: "Registro de proveedores digitales ante la autoridad del Estado de establecimiento principal."}
  - {art: "29", tema: Intercambio de información, resumen: "Acuerdos voluntarios de intercambio de información sobre amenazas."}
  - {art: "32", tema: Supervisión de entidades esenciales, resumen: "Supervisión ex ante: inspecciones, auditorías periódicas y ad hoc, escaneos de seguridad."}
  - {art: "33", tema: Supervisión de entidades importantes, resumen: "Supervisión ex post, ante indicios de incumplimiento."}
  - {art: "34", tema: Multas administrativas, resumen: "Esenciales: hasta 10 M€ o 2 % de la facturación mundial. Importantes: hasta 7 M€ o 1,4 %. Se aplica la cifra mayor."}

sectores:
  anexo_I_alta_criticidad:
    - Energía (electricidad, calefacción y refrigeración urbanas, petróleo, gas, hidrógeno)
    - Transporte (aéreo, ferroviario, marítimo, por carretera)
    - Banca
    - Infraestructuras de los mercados financieros
    - Sanidad
    - Agua potable
    - Aguas residuales
    - Infraestructura digital
    - Gestión de servicios TIC (entre empresas)
    - Administración pública
    - Espacio
  anexo_II_otros_sectores_criticos:
    - Servicios postales y de mensajería
    - Gestión de residuos
    - Fabricación, producción y distribución de sustancias y mezclas químicas
    - Producción, transformación y distribución de alimentos
    - Fabricación (productos sanitarios, informáticos, electrónicos, ópticos, eléctricos, maquinaria, vehículos y otro material de transporte)
    - Proveedores digitales (mercados en línea, motores de búsqueda, redes sociales)
    - Investigación

