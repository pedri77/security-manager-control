    tipo: directiva
    eficacia: Obliga a los Estados miembros; llega a las entidades a través de la ley nacional de transposición
    plazo_transposicion: "2024-10-17"
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - id: NIS2-RE-2690
    titulo: Reglamento de Ejecución (UE) 2024/2690 — requisitos técnicos y metodológicos
    tipo: reglamento_ejecucion
    eficacia: Directamente aplicable en todos los Estados miembros (también España) desde el 2024-11-07
    ambito: Proveedores DNS, registros TLD, cloud, centros de datos, CDN, MSP, MSSP, marketplaces, buscadores, redes sociales, prestadores de servicios de confianza
    url: https://eur-lex.europa.eu/eli/reg_impl/2024/2690/oj
  - id: ENISA-TIG
    titulo: ENISA — Technical Implementation Guidance sobre el Reglamento 2024/2690 (v1.0, junio 2025) + tabla de correspondencias
