[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "security-manager-control"
version = "0.9.2"
description = "Centro de control para el Security Manager: NIS2, ENS, transversal y red"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "smc/assets/THREE-LICENSE"]
authors = [{name = "David Moya García"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smc = "smc.cli:main"

[tool.setuptools]
packages = ["smc"]

[tool.setuptools.package-data]
smc = ["assets/*"]
