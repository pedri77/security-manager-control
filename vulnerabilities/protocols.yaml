# Vulnerabilidades por protocolo (T11, v0.5).
# Orientativo y sin CVEs concretos: `consulta` solo trae URLs de búsqueda en fuentes oficiales.
# Los CWE y las técnicas ATT&CK (T1xxx enterprise, T0xxx ICS) son representativos y se contrastan con MITRE antes de citarlos.
# Las URLs de búsqueda no se han podido comprobar sin red: verificar a mano (INCIBE-CERT y CCN-CERT apuntan a su listado, sin filtro).
